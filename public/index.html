<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyPilot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">🧭 <strong>StudyPilot</strong> <span class="muted">Smart planner for Notion Student OS</span></div>
    <span id="mode" class="pill"></span>
  </header>

  <main>
    <section class="controls card">
      <label for="hours">Hours I can study today</label>
      <input id="hours" type="range" min="1" max="10" step="0.5" value="4">
      <output id="hoursOut">4h</output>
      <button id="sync" title="Write this plan into Notion as a page">Send plan to Notion</button>
      <span id="syncMsg" class="muted"></span>
    </section>

    <section class="stats" id="stats"></section>

    <div class="grid">
      <section class="card">
        <h2>Today's focus plan</h2>
        <ol id="blocks" class="blocks"></ol>
      </section>
      <section class="card">
        <h2>Workload ahead</h2>
        <div id="weeks"></div>
        <h2 class="spaced">Hours left by course</h2>
        <div id="courses"></div>
      </section>
    </div>

    <section class="card">
      <h2>All open work, ranked</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Task</th><th>Course</th><th>Due</th><th>Left</th><th>Status</th></tr></thead>
          <tbody id="ranked"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
